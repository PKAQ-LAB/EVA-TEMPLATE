spring:
  datasource:
    url: ${EVA_DB_URL:jdbc:postgresql://localhost:5432/template_api?currentSchema=eva}
    username: ${EVA_DB_USERNAME:postgres}
    password: ${EVA_DB_PASSWORD:}
  data:
    redis:
      host: ${EVA_REDIS_HOST:localhost}
      port: ${EVA_REDIS_PORT:6379}
      database: ${EVA_REDIS_DATABASE:0}
      password: ${EVA_REDIS_PASSWORD:}
      timeout: 10s
logging:
  level:
    root: INFO
