spring:
  application:
    name: template-api
  profiles:
    default: dev
  config:
    import: classpath:config/eva/eva.yaml
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  messages:
    basename: i18n/i18n,i18n/sys
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  flyway:
    # 单一初始化脚本仅用于新空库，默认不执行。
    enabled: false
    baseline-on-migrate: false
    locations: classpath:db/migration
  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 30000
      max-lifetime: 1800000
      maximum-pool-size: 10
  data:
    redis:
      repositories:
        enabled: false
server:
  port: ${SERVER_PORT:9016}
  servlet:
    context-path: /api
  shutdown: graceful
mybatis-plus:
  mapper-locations: classpath*:/mapper/*.xml
  type-aliases-package: io.nerv.**.entity,org.pkaq.**.entity
  type-handlers-package: org.pkaq.core.mybatis.enums
  global-config:
    banner: false
    db-config:
      id-type: assign_id
      logic-delete-value: 'CAST(FLOOR(EXTRACT(EPOCH FROM CURRENT_TIMESTAMP)) AS bigint)'
      logic-not-delete-value: 0
      where-strategy: not_empty
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
management:
  endpoints:
    web:
      exposure:
        include: health
springdoc:
  default-flat-param-object: true
logging:
  file:
    name: ${EVA_LOG_FILE:./logs/template-api.log}
