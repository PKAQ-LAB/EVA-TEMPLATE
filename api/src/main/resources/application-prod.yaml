spring:
  datasource:
    url: ${EVA_DB_URL}
    username: ${EVA_DB_USERNAME}
    password: ${EVA_DB_PASSWORD}
  data:
    redis:
      host: ${EVA_REDIS_HOST}
      port: ${EVA_REDIS_PORT:6379}
      database: ${EVA_REDIS_DATABASE:0}
      password: ${EVA_REDIS_PASSWORD}
      timeout: 10s
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
