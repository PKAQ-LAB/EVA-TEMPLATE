plugins {
    alias(libs.plugins.spring.boot)
}

bootJar { mainClass = 'io.nerv.WebBooter' }
jar { enabled = false }

description = 'EVA 应用启动模板'

// PostgreSQL 宿主不加载 EVA 通用依赖中的 MySQL Flyway 适配器。
configurations.configureEach {
    exclude group: libs.flyway.mysql.get().module.group, module: libs.flyway.mysql.get().module.name
}

dependencies {
    implementation libs.eva.common,
                   libs.eva.mybatis,
                   libs.eva.web.core,
                   libs.eva.auth,
                   libs.eva.system,
                   libs.spring.web,
                   libs.spring.actuator,
                   libs.springdoc,
                   libs.flyway.postgresql
    runtimeOnly libs.postgresql
    testImplementation libs.spring.test
    testRuntimeOnly libs.junit.launcher
}
