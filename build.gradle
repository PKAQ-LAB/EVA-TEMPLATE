plugins {
    alias(libs.plugins.spring.dependency.management)
    alias(libs.plugins.spring.boot) apply false
}

allprojects {
    group = 'org.pkaq'
    version = '1.0.0'
}

subprojects {
    apply plugin: 'java-library'
    apply plugin: 'io.spring.dependency-management'

    java {
        toolchain { languageVersion = JavaLanguageVersion.of(25) }
    }

    ext['flyway.version'] = libs.versions.flyway.get()
    dependencyManagement {
        imports { mavenBom libs.spring.boot.bom.get().toString() }
    }

    repositories {
        maven {
            name = 'nexus'
            def baseUrl = providers.gradleProperty('nexusBaseUrl')
                    .getOrElse('http://dev.jm-sk.com:12081').replaceAll('/+$', '')
            url = uri("${baseUrl}/repository/maven-public/")
            allowInsecureProtocol = url.scheme == 'http'
            if (providers.gradleProperty('nexusUsername').isPresent()
                    || providers.gradleProperty('nexusPassword').isPresent()) {
                credentials(PasswordCredentials)
            }
        }
        mavenCentral()
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.compilerArgs.add('-parameters')
    }
    tasks.withType(Javadoc).configureEach {
        options.encoding = 'UTF-8'
        options.addStringOption('Xdoclint:none', '-quiet')
    }
    tasks.withType(Test).configureEach { useJUnitPlatform() }
}
